name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  verify:
    name: Verify workspaces
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SERPER_API_KEY: ci-placeholder-serper-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      SENTRY_DSN: https://public@example.ingest.sentry.io/1
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
      CRON_SECRET: ci-placeholder-cron-secret
      ADMIN_EMAILS: ci@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:high
      - run: npm run security:boundaries
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build production web bundle
        run: node scripts/ci/run-with-annotation.mjs "Production build" npm run web:build
      - run: npm run security:boundaries

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser acceptance
        run: node scripts/ci/run-with-annotation.mjs "Browser acceptance" npm --workspace @rober/web run test:browser

  supabase-integration:
    name: RLS and auth integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERPER_API_KEY: ci-placeholder-serper-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      SENTRY_DSN: https://public@example.ingest.sentry.io/1
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
      CRON_SECRET: ci-placeholder-cron-secret
      ADMIN_EMAILS: ci@example.com
      AUTH_BROWSER_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.110.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start migrated local Supabase
        run: |
          set -euo pipefail
          supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
          node scripts/ci/run-with-annotation.mjs "Supabase migration reset" supabase db reset --local --no-seed
          eval "$(supabase status -o env)"
          : "${API_URL:?Supabase status did not return API_URL}"
          : "${ANON_KEY:?Supabase status did not return ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?Supabase status did not return SERVICE_ROLE_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Verify RLS policies
        run: node scripts/ci/run-with-annotation.mjs "RLS verification" npm run test:rls
      - name: Verify ingestion boundaries
        run: node scripts/ci/run-with-annotation.mjs "Ingestion verification" npm run test:ingestion:live
      - name: Verify browser auth and guest merge
        run: |
          npm --workspace @rober/web run dev -- --port 3000 > /tmp/rober-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/auth > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/rober-web.log
              exit 1
            fi
            sleep 1
          done
          npm run test:auth:live
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
