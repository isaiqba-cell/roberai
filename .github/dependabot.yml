version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-runtime:
        patterns:
          - next
          - react
          - react-dom
          - "@sentry/*"
          - "@supabase/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
